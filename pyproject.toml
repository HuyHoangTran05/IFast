[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifast-api"
version = "0.1.0"
description = "IFast — nền tảng web bán ô tô điện"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

# Repo này là monorepo: web/, infra/, contracts/, alembic/ nằm cùng cấp với mã
# Python. Không khai báo tường minh thì setuptools sẽ coi tất cả là package và
# từ chối build. Chỉ đóng gói api/ và ai/.
[tool.setuptools.packages.find]
include = ["api*", "ai*"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["api", "ai"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
