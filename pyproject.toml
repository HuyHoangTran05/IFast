[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifast-api"
version = "0.1.0"
description = "IFast — nền tảng web bán ô tô điện"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

# Repo này là monorepo: web/, infra/, contracts/, alembic/ nằm cùng cấp với mã
# Python. Không khai báo tường minh thì setuptools sẽ coi tất cả là package và
# từ chối build. Chỉ đóng gói api/ và ai/.
[tool.setuptools.packages.find]
include = ["api*", "ai*"]

[project.optional-dependencies]
# Ruff ghim đúng phiên bản: linter thả lỏng khiến CI đỏ khi có bản mới
# ra đời dù không ai sửa dòng code nào.
dev = ["pytest>=8.3", "httpx>=0.28", "ruff==0.16.7"]

[tool.pytest.ini_options]
testpaths = ["api", "ai"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

# Khai báo tập rule tường minh. Dựa vào mặc định của ruff nghĩa là mỗi bản ruff
# mới có thể đổi luật chơi dưới chân mình — đã ghim phiên bản thì cũng nên ghim
# luôn rule.
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "DTZ", "RUF"]
ignore = [
    # Depends(...) trong tham số mặc định là idiom chính thức của FastAPI.
    "B008",
    # Độ dài dòng đã do formatter lo.
    "E501",
    # Luật ký tự Unicode "dễ nhầm" dành cho nội dung ASCII. Tài liệu và thông
    # báo lỗi của dự án viết bằng tiếng Việt nên luật này chỉ tạo nhiễu.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Script và env của alembic phải chèn sys.path trước khi import package.
"scripts/*.py" = ["E402"]
"alembic/env.py" = ["E402"]
"api/tests/conftest.py" = ["E402"]
# dict(...) kiểu kwargs là dạng dễ đọc nhất cho hàm dựng fixture trong test.
"api/tests/*.py" = ["C408"]
